<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>History of Internet in South Korea</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/mustache@latest/mustache.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .jumbotron {
      background: linear-gradient(120deg, #722828, rgb(206, 206, 211), #253860);
      color: white;
    }

    .card-img-top {
      height: 200px;
      object-fit: cover;
    }

    footer {
      background: #f8f9fa;
      padding: 20px;
      text-align: center;
      margin-top: 40px;
    }

    /* Ensure homepage intro matches Evolution section */
    #homepage-container .lead {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.25rem;
      font-weight: 300;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#"><img src="assets/skinternetlogo.jpeg" width="65" height="40" alt="Logo"> SK
      Internet</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="timeline.html">Timeline</a></li>
        <li class="nav-item"><a class="nav-link" href="isps.html">ISPs</a></li>
        <li class="nav-item"><a class="nav-link active" href="usage.html">Internet Usage</a></li>
      </ul>
    </div>
  </nav>

  <!-- Container where Mustache renders content -->
  <div id="homepage-container"></div>

  <!-- Mustache Template -->
  <script id="homepage-template" type="text/x-mustache-template">
    <!-- Jumbotron -->
  <header class="jumbotron text-center mb-4">
    <div class="container">
      <h1 class="display-4">{{siteTitle}}</h1>
      <p class="lead">{{tagline}}</p>
      <a href="timeline.html" class="btn btn-light btn-lg">Explore Timeline</a>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h2 class="mb-3">Introduction</h2>
        <p class="lead">{{intro}}</p>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img src="{{introImage.src}}" class="card-img-top" alt="{{introImage.title}}">
          <div class="card-body">
            <h5 class="card-title">{{introImage.title}}</h5>
            <p class="card-text">{{introImage.description}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Government Role Section -->
  <div class="container mt-5">
    <h2>Role of Government in the success of South Korea's Internet</h2>
    <p>{{govRole}}</p>
  </div>

  <!-- People’s Role Section -->
  <div class="container mt-4">
    <h2>Role of Citizens in the success of South Korea's Internet</h2>
    <p>{{peopleRole}}</p>
  </div>

  <!-- Milestones Section -->
  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">Key Milestones</h2>
      <div class="row">
        {{#milestones}}
        <div class="col-md-4">
          <div class="card mb-4">
            <img src="{{img}}" class="card-img-top" alt="{{title}}">
            <div class="card-body">
              <h5 class="card-title">{{title}}</h5>
              <p class="card-text">{{description}}</p>
              <button class="btn btn-primary" data-toggle="modal" data-target="#modal{{@index}}">Read More</button>
            </div>
          </div>
        </div>
        {{/milestones}}
      </div>
    </div>
  </section>

  <!-- Modals -->
  {{#milestones}}
  <div class="modal fade" id="modal{{@index}}">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{title}}</h5>
          <button class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">{{modal}}</div>
      </div>
    </div>
  </div>
  {{/milestones}}
  </script>

  <footer>
    <p>&copy; 2025 History of Internet in South Korea</p>
  </footer>

  <!-- Scripts -->
  <script>
    async function renderHomepage() {
      try {
        const res = await fetch('homepage.json');
        const data = await res.json();
        const template = document.getElementById('homepage-template').innerHTML;
        document.getElementById('homepage-container').innerHTML = Mustache.render(template, data);
      } catch (err) {
        console.error('Failed to load homepage.json:', err);
        document.getElementById('homepage-container').innerHTML = '<p class="text-danger">Failed to load homepage data.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', renderHomepage);
  </script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
