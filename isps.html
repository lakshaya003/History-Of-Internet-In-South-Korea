<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>ISPs in South Korea</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/mustache@latest/mustache.min.js"></script>
  <style>
    .jumbotron {
      background: linear-gradient(120deg, #722828, rgb(206, 206, 211), #253860);
      color: white;
    }

    footer {
      background-color: #f8f9fa;
      color: #121111;
      padding: 20px;
      text-align: center;
      margin-top: 40px;
    }

    .navbar-brand img {
      margin-right: 10px;
    }

    .isp-entry {
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f8f9fa;
    }

    .isp-entry h5 {
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .btn-secondary {
      background-color: #555;
      border-color: #555;
      color: #fff;
    }

    hr.section-divider {
      margin: 3rem 0;
      border-top: 2px solid #bbb;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">
      <img src="assets/skinternetlogo.jpeg" width="65" height="40" alt="Logo">
      SK Internet
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="timeline.html">Timeline</a></li>
        <li class="nav-item"><a class="nav-link active" href="isps.html">ISPs</a></li>
        <li class="nav-item"><a class="nav-link active" href="usage.html">Internet Usage</a></li>
      </ul>
    </div>
  </nav>

  <!-- Jumbotron -->
  <header class="jumbotron text-center mb-4">
    <div class="container">
      <h1 class="display-4">ISPs in South Korea</h1>
      <p class="lead">Major Internet Service Providers and their services.</p>
    </div>
  </header>

  <!-- ISP Container -->
  <div class="container py-4" id="isps-container">
    <!-- Mustache will render sections here -->
  </div>

  <!-- Mustache Template -->
  <script id="isps-template" type="text/x-mustache-template">
  <!-- Evolution Section -->
  <section class="mb-5">
    <h2 class="mb-3">Evolution of ISPs</h2>
    <p class="lead">{{evolution}}</p>
  </section>
  <!-- Early 2000s ISPs -->
  <h3>ISPs in the Early 2000s</h3>
  <div class="row">
    {{#isps}}
    {{#isEarly2000s}}
    <div class="col-md-6">
      <div class="isp-entry">
        <h5>{{name}}</h5>
        <p><strong>Service:</strong> {{service}}</p>
        <p><strong>Notes:</strong> {{notes}}</p>
      </div>
    </div>
    {{/isEarly2000s}}
    {{/isps}}
  </div>

  <hr class="section-divider">

  <!-- Today's ISPs -->
  <h3>ISPs Today</h3>
  <div class="row">
    {{#isps}}
    {{#isToday}}
    <div class="col-md-6">
      <div class="isp-entry">
        <h5>{{name}}</h5>
        <p><strong>Service:</strong> {{service}}</p>
        <p><strong>Notes:</strong> {{notes}}</p>
      </div>
    </div>
    {{/isToday}}
    {{/isps}}
  </div>

  <hr class="my-5">

  <!-- Key Differences Between Eras -->
  <section class="mb-5">
    <h3 class="mt-4">Key Differences Between ISPs Early 2000s and Today</h3>
    <ul class="list-group">
      {{#eraComparison}}
      <li class="list-group-item">
        <strong>{{aspect}}:</strong> Early 2000s: {{early2000s}}; Today: {{today}}
      </li>
      {{/eraComparison}}
    </ul>
  </section>


  </script>
  <!-- Render ISPs via JS -->
  <script>
    async function renderISPs() {
      try {
        const response = await fetch('isps.json');
        if (!response.ok) throw new Error('Failed to load isps.json');
        const data = await response.json();

        const template = document.getElementById('isps-template').innerHTML;
        document.getElementById('isps-container').innerHTML = Mustache.render(template, data);
      } catch (error) {
        console.error(error);
        document.getElementById('isps-container').innerHTML = '<p class="text-danger">Failed to load ISP data.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', renderISPs);
  </script>

  <!-- Back Button -->
  <div class="text-center mt-3">
    <a href="index.html" class="btn btn-secondary">Back Home</a>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 History of Internet in South Korea</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
