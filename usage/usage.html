<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Internet Usage in South Korea</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mustache@latest/mustache.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .jumbotron {
            background: linear-gradient(120deg, #722828, rgb(206, 206, 211), #253860);
            color: white;
        }

        .card-img-top {
            height: 300px;
            object-fit: cover;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
        }

        /* Ensures text styling matches homepage */
        #usage-container .lead {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 1.25rem;
            font-weight: 300;
        }

        /* Navbar link colors */
        .navbar-dark .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.7);
            /* slightly faded white by default */
            transition: color 0.3s;
        }

        .navbar-dark .navbar-nav .nav-link:hover,
        .navbar-dark .navbar-nav .nav-link.active {
            color: #ffffff;
            /* full white on hover or active */
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="index.html"><img src="assets/skinternetlogo.jpeg" width="65" height="40"
                alt="Logo"> SK Internet</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="timeline.html">Timeline</a></li>
                <li class="nav-item"><a class="nav-link" href="isps.html">ISPs</a></li>
                <li class="nav-item"><a class="nav-link active" href="usage.html">Internet Usage</a></li>
            </ul>
        </div>
    </nav>

    <!-- Container where Mustache renders content -->
    <div id="usage-container"></div>

    <!-- Mustache Template -->
    <script id="usage-template" type="text/x-mustache-template">
  <!-- Jumbotron -->
    <header class="jumbotron text-center mb-5">
        <div class="container">
            <h1 class="display-4">{{pageTitle}}</h1>
            <p class="lead">{{tagline}}</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row">
            <div class="col-md-8">
                <h2 class="mb-3">Overview</h2>
                <p class="lead">{{overview}}</p>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <img src="{{image.src}}" class="card-img-top" alt="{{image.title}}">
                    <div class="card-body">
                        <h5 class="card-title">{{image.title}}</h5>
                        <p class="card-text">{{image.description}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Internet Usage Section -->
    <section class="container mb-5">
        <h2 class="mb-4">Internet Usage: Then vs Today</h2>

        <div class="mb-4">
            <h4>Early 2000s – 2010</h4>
            {{#activitiesEarly}}
            <p>{{@index + 1}}. <strong>{{name}}:</strong> {{description}}</p>
            {{/activitiesEarly}}
        </div>

        <div class="mb-4">
            <h4>Today</h4>
            {{#activitiesToday}}
            <p>{{@index + 1}}. <strong>{{name}}:</strong> {{description}}</p>
            {{/activitiesToday}}
        </div>
    </section>

    <!-- Social Media Engagement Section -->
    <section class="container mb-5">
        <h2 class="mb-4">Social Media Engagement: Then vs Today</h2>

        <div class="row">
            <div class="col-md-8">
                <div class="mb-4">
                    <h4>Early 2000s – 2010</h4>
                    {{#socialMediaEarly}}
                    <p>{{@index + 1}}. <strong>{{platform}}:</strong> {{stats}}</p>
                    {{/socialMediaEarly}}
                </div>

                <div class="mb-4">
                    <h4>Today</h4>
                    {{#socialMediaToday}}
                    <p>{{@index + 1}}. <strong>{{platform}}:</strong> {{stats}}</p>
                    {{/socialMediaToday}}
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <img src="{{socialMediaImage.src}}" class="card-img-top" alt="{{socialMediaImage.title}}">
                    <div class="card-body">
                        <h5 class="card-title">{{socialMediaImage.title}}</h5>
                        <p class="card-text">{{socialMediaImage.description}}</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- CyberSecurity Section -->
    <section class="container mb-5">
        <h2 class="mb-4">CyberSecurity: Then vs Today</h2>

        <div class="row">
            <div class="col-md-8">
                <div class="mb-4">
                    <h4>Early 2000s</h4>
                    {{#cyberSecurity.early2000s}}
                    <p>{{@index + 1}}. {{.}}</p>
                    {{/cyberSecurity.early2000s}}
                </div>

                <div class="mb-4">
                    <h4>Today</h4>
                    {{#cyberSecurity.today}}
                    <p>{{@index + 1}}. {{.}}</p>
                    {{/cyberSecurity.today}}
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <img src="{{cyberSecurity.image.src}}" class="card-img-top" alt="{{cyberSecurity.image.title}}">
                    <div class="card-body">
                        <h5 class="card-title">{{cyberSecurity.image.title}}</h5>
                        <p class="card-text">{{cyberSecurity.image.description}}</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </script>

    <!-- Back Button -->
    <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Back Home</a>
    </div>
    <footer>
        <p>&copy; 2025 History of Internet in South Korea</p>
    </footer>

    <!-- Scripts -->
    <script>
        async function renderUsage() {
            try {
                const res = await fetch('usage.json');
                const data = await res.json();
                const template = document.getElementById('usage-template').innerHTML;
                document.getElementById('usage-container').innerHTML = Mustache.render(template, data);
            } catch (err) {
                console.error('Failed to load usage.json:', err);
                document.getElementById('usage-container').innerHTML = '<p class="text-danger">Failed to load internet usage data.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', renderUsage);
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
